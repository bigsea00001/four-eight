name: FourEight
options:
  bundleIdPrefix: com.waylake
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  SajuKit:
    path: SajuKit
  RemoteLLM:
    path: RemoteLLM
  MLXSwiftLM:
    url: https://github.com/ml-explore/mlx-swift-lm
    from: 3.31.3
  SwiftHuggingFace:
    url: https://github.com/huggingface/swift-huggingface
    from: 0.9.0
  SwiftTransformers:
    url: https://github.com/huggingface/swift-transformers
    from: 1.3.0
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.9.4

targets:
  FourEight:
    type: application
    platform: macOS
    sources:
      - App/FourEight
    dependencies:
      - package: SajuKit
      - package: RemoteLLM
      - package: MLXSwiftLM
        products: [MLXLLM, MLXLMCommon, MLXHuggingFace]
      - package: SwiftHuggingFace
        product: HuggingFace
      - package: SwiftTransformers
        product: Tokenizers
      - package: Sparkle
        product: Sparkle
    entitlements:
      path: App/FourEight.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-write: true
        # Sparkle이 샌드박스 안에서 업데이트를 설치하려면 Installer XPC와
        # 통신해야 한다. 이름은 번들 ID에서 파생되며 Sparkle이 고정한 규약이다.
        # 샌드박스를 끄면 이 둘이 필요 없지만, 이 앱의 프라이버시 주장이
        # 샌드박스에 기대고 있으므로 켠 채로 간다.
        com.apple.security.temporary-exception.mach-lookup.global-name:
          - $(PRODUCT_BUNDLE_IDENTIFIER)-spks
          - $(PRODUCT_BUNDLE_IDENTIFIER)-spki
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: FourEight
        # --- Sparkle 자동 업데이트 ---
        # SUFeedURL은 한 번 배포되면 영원히 살려야 한다. 구버전 앱이 이
        # 주소를 박고 나가므로 바꾸면 그 사용자들은 업데이트를 못 받는다.
        SUFeedURL: https://waylake.github.io/four-eight/appcast.xml
        # 이 공개키에 대응하는 개인키를 잃으면 업데이트를 서명할 수 없다.
        # Sparkle은 키 제거를 허용하지 않으므로 교체만 가능하다.
        SUPublicEDKey: 8MN3DdiGkKYCAbDUs3stVtsWDMgl5nPB1DwriETkTIg=
        # 확인은 하되 조용히 받아 두지 않는다. 사용자가 승인해야 설치된다.
        SUEnableAutomaticChecks: true
        SUAutomaticallyUpdate: false
        SUScheduledCheckInterval: 86400
        # 샌드박스 앱에는 Installer XPC가 필요하다.
        SUEnableInstallerLauncherService: true
        # Downloader XPC는 켜지 않는다. network.client가 이미 있고,
        # 켜면 릴리스 노트가 deprecated WebView로 렌더링된다.
        SUEnableDownloaderService: false
        # 빌드 설정에서 주입한다. 릴리스 워크플로가 태그에서 값을 계산해
        # xcodebuild에 넘긴다. 자세한 규칙은 docs/release.md 참고.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # 이 Mac 안의 평문 HTTP를 위한 의도 표명.
        #
        # macOS 26 실측에서는 loopback·사설 IPv4로의 http가 ATS 예외 키
        # 없이도 통과했다. 그런데 Apple 문서는 "macOS 14부터 ATS는 IP
        # 주소로의 연결을 기본 허용하지 않는다"고 적어 실측과 어긋난다.
        # 이 앱의 최소 버전은 15.0이고 거기서는 재측정하지 않았으므로,
        # Apple이 문서에서 직접 권하는 대로 의도를 명시해 둔다.
        # 원격(이 Mac 밖) 평문은 Endpoint가 거부하므로 이 키가 넓히는
        # 범위는 로컬뿐이다.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # 사용자가 다른 기기의 Ollama를 가리킬 수 있다. macOS 15부터
        # 나가는 TCP 연결은 로컬 네트워크 권한을 요구하며(TN3179),
        # 루프백은 예외다. 한 번 거절하면 초기화하는 방법이 없으므로
        # 이 문장이 사용자가 판단할 유일한 근거다.
        NSLocalNetworkUsageDescription: "이 Mac이나 같은 네트워크의 다른 기기에서 도는 AI 서버(Ollama, LM Studio 등)에 연결할 때만 씁니다. 생년월일시와 해석은 사용자가 직접 지정한 주소로만 갑니다."
        LSApplicationCategoryType: public.app-category.lifestyle
        LSMinimumSystemVersion: "15.0"
        NSSupportsAutomaticTermination: true
        NSSupportsSuddenTermination: false
    settings:
      base:
        # 로컬 개발 기본값. 릴리스 빌드는 xcodebuild 인자로 덮어쓴다.
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        # Apple Silicon 전용으로 고정한다.
        #
        # MLX는 Metal 기반이라 Apple Silicon에서만 동작한다. x86_64 슬라이스를
        # 만들어도 모델을 로드하는 순간 쓸 수 없고, 빌드 시간만 두 배가 되며
        # 쓰지 못할 코드가 번들에 들어간다.
        ARCHS: arm64
        ONLY_ACTIVE_ARCH: NO
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        # Hardened Runtime은 Library Validation을 포함한다. ad-hoc 서명과
        # 겹치면 시스템이 Sparkle.framework 로드를 막는다. 공증을 하지 않는
        # 지금은 Hardened Runtime을 켤 실익도 없다.
        #
        # Developer ID 인증서가 생기면 이 값을 true로 되돌리고 공증을 켠다.
        # 그때는 ad-hoc이 아니므로 Library Validation 문제가 사라진다.
        ENABLE_HARDENED_RUNTIME: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_STRICT_CONCURRENCY: complete
        DEAD_CODE_STRIPPING: true

schemes:
  FourEight:
    build:
      targets:
        FourEight: all
    run:
      config: Debug
    test:
      config: Debug
