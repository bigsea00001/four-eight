<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>사주 명식 — 브라우저에서 바로</title>
<meta name="description" content="생년월일시를 넣으면 브라우저 안에서 사주 명식을 계산합니다. 생년월일시는 이 기기를 벗어나지 않습니다.">
<link rel="canonical" href="https://fe.eet.kr/">
<meta property="og:type" content="website">
<meta property="og:title" content="사주 명식 — 브라우저에서 바로 계산">
<meta property="og:description" content="생년월일시를 넣으면 브라우저 안(WebAssembly)에서 사주 명식을 계산합니다. 네 기둥·오행·신살과 근거 규칙 해석까지. 생년월일시는 이 기기를 벗어나지 않습니다.">
<meta property="og:url" content="https://fe.eet.kr/">
<meta name="twitter:card" content="summary">
<!--
  이 페이지는 소개 페이지(../index.html)와 같은 팔레트·글꼴을 씁니다.
  색 변수는 앱 DesignSystem.swift에서 온 것을 소개 페이지가 이미 옮겨 둔 값이라,
  그대로 다시 선언만 합니다 — 눈으로 새로 고르지 않습니다.
  오행 색(목청·화적·토황·금백·수흑)은 명리에서 의미가 있는 색이라 유지합니다.
-->
<style>
  :root {
    --paper:#FAF7F0; --surface:#FFFFFF; --ink:#2A251F; --ink-soft:#6B6154;
    --ink-faint:#9A9083; --line:#E2D9C9; --cinnabar:#B43A2E; --code-bg:#ECE5D8;
    /* 오행 — 앱 팔레트 그대로 */
    --wood:#00876B; --fire:#EE7038; --earth:#7F5502; --metal:#8898EC; --water:#2E4E9C;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper:#1B1917; --surface:#262320; --ink:#E8E1D6; --ink-soft:#ABA294;
      --ink-faint:#7C7365; --line:#3A352F; --cinnabar:#D05A48; --code-bg:#302B26;
      --wood:#0F9078; --fire:#E56636; --earth:#95670A; --metal:#8898EC; --water:#6866D4;
    }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--paper); color:var(--ink);
    font:16px/1.7 -apple-system, BlinkMacSystemFont, "Pretendard", "Apple SD Gothic Neo", system-ui, sans-serif;
    word-break:keep-all; overflow-wrap:break-word; }
  .hanja { font-family:"AppleMyungjo","Nanum Myeongjo",serif; }
  main { max-width:46rem; margin:0 auto; padding:0 1.25rem 4rem; }
  .bar { display:flex; align-items:center; gap:.6rem; max-width:46rem; margin:0 auto;
    padding:1rem 1.25rem; font-size:.85rem; color:var(--ink-soft); }
  .bar .mark { font-size:1.2rem; color:var(--cinnabar); letter-spacing:.08em; }
  .bar .name { font-weight:650; color:var(--ink); }
  .bar a { margin-left:auto; color:var(--cinnabar); text-decoration:none; font-size:.85rem; }
  h1 { font-family:"AppleMyungjo","Nanum Myeongjo",serif; font-size:1.7rem; margin:.4rem 0 .2rem; letter-spacing:-.01em; }
  .sub { color:var(--ink-soft); font-size:.92rem; margin-bottom:1rem; }
  .privacy { background:color-mix(in srgb, var(--wood) 10%, var(--surface));
    border:1px solid color-mix(in srgb, var(--wood) 30%, var(--line));
    color:var(--wood); font-size:.83rem; padding:.6rem .8rem; border-radius:9px; margin-bottom:1.1rem; }
  .form { display:flex; flex-wrap:wrap; gap:.5rem; align-items:flex-end;
    background:var(--surface); border:1px solid var(--line); border-radius:13px; padding:1rem; }
  .fld { display:flex; flex-direction:column; gap:.25rem; }
  .fld label { font-size:.72rem; color:var(--ink-soft); }
  .fld input, .fld select { font-size:1rem; padding:.5rem .55rem; border:1px solid var(--line);
    border-radius:8px; background:var(--paper); color:var(--ink); width:4.6rem; }
  #go { margin-left:auto; background:var(--cinnabar); color:#fff; border:0; border-radius:9px;
    padding:.65rem 1.3rem; font-size:1rem; font-weight:600; cursor:pointer; }
  #go:hover { filter:brightness(1.08); }
  #status { font-size:.8rem; color:var(--ink-soft); margin:.7rem .2rem; min-height:1rem; }
  /* 로딩 안내 (스피너 + 임시 문구) */
  #loading { display:none; align-items:center; gap:.7rem; background:var(--surface);
    border:1px solid var(--line); border-radius:12px; padding:1rem 1.1rem; margin-top:.9rem; }
  #loading.on { display:flex; }
  .spinner { width:22px; height:22px; border:3px solid var(--line);
    border-top-color:var(--cinnabar); border-radius:50%; animation:spin .8s linear infinite; flex:none; }
  @keyframes spin { to { transform:rotate(360deg); } }
  #loading .txt { font-size:.9rem; color:var(--ink-soft); }
  #loading .txt b { color:var(--ink); font-weight:600; }
  #error { background:color-mix(in srgb, var(--cinnabar) 8%, var(--surface));
    border:1px solid color-mix(in srgb, var(--cinnabar) 35%, var(--line)); color:var(--cinnabar);
    padding:.9rem; border-radius:10px; font-size:.85rem; white-space:pre-wrap; word-break:break-word; }
  .head { background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:.8rem 1rem; margin-bottom:.9rem; }
  .hline { font-size:.9rem; padding:.12rem 0; }
  .lab { color:var(--ink-soft); font-size:.78rem; }
  .flag { background:color-mix(in srgb, var(--fire) 18%, var(--surface));
    border:1px solid color-mix(in srgb, var(--fire) 45%, var(--line)); color:var(--fire);
    border-radius:6px; padding:0 .35rem; font-size:.72rem; }
  table.saju { width:100%; border-collapse:collapse; background:var(--surface);
    border:1px solid var(--line); border-radius:12px; overflow:hidden; }
  table.saju th, table.saju td { text-align:center; padding:.5rem .25rem; border:1px solid var(--line); font-size:.82rem; }
  table.saju thead th { background:var(--code-bg); font-size:.76rem; color:var(--ink-soft); }
  table.saju td.rl { background:var(--paper); color:var(--ink-soft); font-size:.74rem; width:4.8rem; }
  .ch { display:block; font-size:1.9rem; font-weight:600; line-height:1.1; }
  .kr { display:block; font-size:.7rem; opacity:.8; }
  .palja { text-align:center; font-size:1.25rem; letter-spacing:2px; margin:.7rem 0 .2rem; }
  .block { background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:.8rem 1rem; margin-top:.9rem; }
  .btitle { font-size:.85rem; font-weight:600; margin-bottom:.7rem; }
  .oheng { display:flex; gap:.6rem; align-items:flex-end; height:6rem; }
  .obar { flex:1; display:flex; flex-direction:column; align-items:center; gap:.25rem; height:100%; justify-content:flex-end; }
  .obar-track { width:100%; height:4rem; background:var(--code-bg); border-radius:6px; display:flex; align-items:flex-end; overflow:hidden; }
  .obar-fill { width:100%; border-radius:6px 6px 0 0; min-height:2px; }
  .olab { font-size:.78rem; } .ocnt { font-size:.78rem; color:var(--ink-soft); }
  .chips { display:flex; flex-wrap:wrap; gap:.4rem; }
  .chip { font-size:.78rem; background:var(--code-bg); border:1px solid var(--line); border-radius:20px; padding:.15rem .65rem; }
  .chip.strong { background:var(--cinnabar); color:#fff; border-color:var(--cinnabar); }
  .chip.rel { background:color-mix(in srgb, var(--water) 12%, var(--surface));
    border-color:color-mix(in srgb, var(--water) 30%, var(--line)); color:var(--water); }
  .sec { margin-bottom:.8rem; }
  .sec-t { font-family:"AppleMyungjo","Nanum Myeongjo",serif; font-size:.92rem; font-weight:600; color:var(--cinnabar); margin-bottom:.25rem; }
  .sec-b { font-size:.9rem; line-height:1.65; color:var(--ink); }
  /* 탭 — 오늘·이달·올해·명식·대운 */
  .tabs { display:flex; gap:.3rem; flex-wrap:wrap; margin:.2rem 0 1rem; border-bottom:1px solid var(--line); }
  .tab { appearance:none; background:none; border:0; border-bottom:2px solid transparent;
    color:var(--ink-soft); font-size:.95rem; padding:.5rem .8rem; cursor:pointer; font-family:inherit; margin-bottom:-1px; }
  .tab:hover { color:var(--ink); }
  .tab.active { color:var(--cinnabar); border-bottom-color:var(--cinnabar); font-weight:650; }
  .panel { display:none; } .panel.on { display:block; }
  /* 간지 두 글자 블록(천간 위·지지 아래, 오행 색) */
  .gj { display:inline-flex; flex-direction:column; align-items:center; line-height:1.05; padding:.3rem .55rem; border-radius:10px; background:var(--code-bg); }
  .gj .gc { font-weight:600; }
  .gj-lg .gc { font-size:2.6rem; } .gj-md .gc { font-size:1.6rem; } .gj-sm .gc { font-size:1.35rem; }
  /* 오늘·이달·올해 머리 카드 */
  .today-head { display:flex; gap:1rem; align-items:center; }
  .today-gj { flex:none; }
  .today-info { display:flex; flex-direction:column; gap:.45rem; }
  .today-title { font-size:1.15rem; font-weight:600; }
  .sub-note { font-size:.78rem; color:var(--ink-soft); }
  .fine { font-size:.74rem; color:var(--ink-faint); margin-top:.55rem; }
  /* 대운·세운·월운 띠 */
  .cyc-band { display:flex; gap:.6rem; margin-top:.9rem; flex-wrap:wrap; }
  .cyc { flex:1; min-width:8rem; background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:.7rem; }
  .cyc-l { font-size:.72rem; color:var(--ink-faint); margin-bottom:.4rem; }
  .cyc-b { display:flex; gap:.5rem; align-items:center; }
  .cyc-t { display:flex; flex-direction:column; line-height:1.3; }
  .cyc-t b { font-size:.9rem; font-weight:600; } .cyc-t span { font-size:.72rem; color:var(--ink-soft); }
  /* 대운 타임라인 */
  .tl-row { display:flex; gap:.4rem; overflow-x:auto; padding:.3rem 0 .5rem; }
  .tl { flex:none; text-align:center; padding:.5rem .55rem; border-radius:10px; border:1.2px solid transparent; background:color-mix(in srgb, var(--ink) 5%, var(--surface)); }
  .tl.on { background:color-mix(in srgb, var(--cinnabar) 12%, var(--surface)); border-color:color-mix(in srgb, var(--cinnabar) 55%, var(--line)); }
  .tl-age { font-size:.72rem; color:var(--ink-faint); margin-bottom:.3rem; }
  .tl-god { font-size:.75rem; color:var(--ink-soft); margin-top:.3rem; }
  .tl.on .tl-god { color:var(--cinnabar); font-weight:600; }
  .tl-yr { font-size:.66rem; color:var(--ink-faint); margin-top:.1rem; }
  .lotto { display:flex; gap:.5rem; flex-wrap:wrap; margin:.1rem 0 .2rem; }
  .lotto-ball { width:2.5rem; height:2.5rem; border-radius:50%; display:inline-flex; align-items:center; justify-content:center; font-weight:700; color:#fff; font-size:1.1rem; text-shadow:0 1px 1px rgba(0,0,0,.25); box-shadow:inset -2px -3px 5px rgba(0,0,0,.22); }
</style>
</head>
<body>
<div class="bar"><span class="mark hanja">四八</span><span class="name">FourEight</span></div>
<main>
  <h1>사주 명식</h1>
  <div class="sub">생년월일시를 넣으면 오늘·이달·올해·명식·대운을 탭으로 봅니다.</div>
  <div class="privacy">🔒 계산은 전부 이 브라우저 안(WebAssembly)에서 일어납니다. 생년월일시는 서버로 전송되지 않습니다. 서버에서 받는 것은 계산 엔진과 규칙 파일뿐입니다.</div>

  <div class="form">
    <div class="fld"><label>연</label><input id="y" type="number" value="2000"></div>
    <div class="fld"><label>월</label><input id="mo" type="number" value="1"></div>
    <div class="fld"><label>일</label><input id="d" type="number" value="1"></div>
    <div class="fld"><label>시 (비우면 미상)</label><input id="h" type="number" value="1"></div>
    <div class="fld"><label>분</label><input id="mi" type="number" value="1"></div>
    <div class="fld"><label>성별</label><select id="g"><option>남</option><option>여</option></select></div>
    <div class="fld"><label>달력</label><select id="cal"><option>양력</option><option>음력</option></select></div>
    <button id="go">사주 보기</button>
  </div>

  <div id="loading"><div class="spinner"></div><div class="txt"><b>사주 계산기를 준비하고 있습니다.</b><br><span id="loadmsg">약 18MB를 한 번만 받습니다. 다음부터는 즉시 열립니다.</span></div></div>
  <div id="status"></div>
  <div id="error" hidden></div>
  <div id="result" hidden></div>
</main>
<script type="module" src="app.js"></script>
</body>
</html>
