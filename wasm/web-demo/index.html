<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>사주 명식 (브라우저 계산)</title>
<style>
  :root { --bg:#f7f6f3; --card:#fff; --line:#e3e0d8; --ink:#2b2b2b; --mut:#8a857a; --accent:#5b4636; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: -apple-system, "Noto Sans KR", "Apple SD Gothic Neo", sans-serif; background:var(--bg); color:var(--ink); }
  .wrap { max-width: 720px; margin: 0 auto; padding: 20px 16px 60px; }
  h1 { font-size: 20px; margin: 4px 0 2px; }
  .sub { color: var(--mut); font-size: 12.5px; margin-bottom: 16px; }
  .privacy { background:#eef5ee; border:1px solid #cfe3cf; color:#2e5d34; font-size:12px; padding:8px 10px; border-radius:8px; margin-bottom:16px; }
  .form { display:flex; flex-wrap:wrap; gap:8px; align-items:flex-end; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; }
  .fld { display:flex; flex-direction:column; gap:4px; }
  .fld label { font-size:11px; color:var(--mut); }
  .fld input, .fld select { font-size:15px; padding:7px 8px; border:1px solid var(--line); border-radius:8px; background:#fff; width:70px; }
  .fld.wide input { width: 84px; }
  #go { margin-left:auto; background:var(--accent); color:#fff; border:0; border-radius:9px; padding:10px 18px; font-size:15px; cursor:pointer; }
  #status { font-size:12px; color:var(--mut); margin:10px 2px; min-height:16px; }
  #error { background:#fdecec; border:1px solid #f5b5b5; color:#a12020; padding:12px; border-radius:10px; font-size:13px; white-space:pre-wrap; word-break:break-word; }
  .head { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px 14px; margin-bottom:14px; }
  .hline { font-size:13.5px; padding:2px 0; }
  .lab { color:var(--mut); font-size:11.5px; }
  .flag { background:#fff3d6; border:1px solid #e6cf90; color:#916400; border-radius:6px; padding:0 5px; font-size:11px; }
  table.saju { width:100%; border-collapse:collapse; background:var(--card); border:1px solid var(--line); border-radius:12px; overflow:hidden; }
  table.saju th, table.saju td { text-align:center; padding:8px 4px; border:1px solid var(--line); font-size:13px; }
  table.saju thead th { background:#f0ede6; font-size:12px; color:var(--mut); }
  table.saju td.rl { background:#faf9f6; color:var(--mut); font-size:11.5px; width:78px; }
  tr.gan td, tr.ji td { padding:6px 4px; }
  .ch { display:block; font-size:30px; font-weight:600; line-height:1.1; }
  .kr { display:block; font-size:11px; color:var(--mut); }
  tr.gan td .kr, tr.ji td .kr { color:inherit; opacity:.75; }
  .palja { text-align:center; font-size:19px; letter-spacing:2px; margin:12px 0 4px; }
  .block { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px 14px; margin-top:14px; }
  .btitle { font-size:13px; font-weight:600; margin-bottom:10px; }
  .oheng { display:flex; gap:10px; align-items:flex-end; height:100px; }
  .obar { flex:1; display:flex; flex-direction:column; align-items:center; gap:4px; height:100%; justify-content:flex-end; }
  .obar-track { width:100%; height:64px; background:#f0ede6; border-radius:6px; display:flex; align-items:flex-end; overflow:hidden; }
  .obar-fill { width:100%; border-radius:6px 6px 0 0; min-height:2px; }
  .olab { font-size:12px; } .ocnt { font-size:12px; color:var(--mut); }
  .chips { display:flex; flex-wrap:wrap; gap:6px; }
  .chip { font-size:12px; background:#f0ede6; border:1px solid var(--line); border-radius:20px; padding:3px 10px; }
  .chip.strong { background:var(--accent); color:#fff; border-color:var(--accent); }
  .chip.rel { background:#eef2f8; border-color:#cdd8e8; color:#3a5580; }
  .sec { margin-bottom:12px; }
  .sec-t { font-size:13px; font-weight:600; color:var(--accent); margin-bottom:4px; }
  .sec-b { font-size:13.5px; line-height:1.65; color:#3a3a3a; }
  .err { color:#a12020; }
</style>
</head>
<body>
<div class="wrap">
  <h1>사주 명식</h1>
  <div class="sub">생년월일시를 넣으면 네 기둥과 해석이 나옵니다.</div>
  <div class="privacy">🔒 계산은 전부 이 브라우저 안(WebAssembly)에서 일어납니다. 생년월일시는 서버로 전송되지 않습니다. 서버에서 받는 것은 계산 엔진과 규칙 파일뿐입니다.</div>

  <div class="form">
    <div class="fld"><label>연</label><input id="y" type="number" value="2003"></div>
    <div class="fld"><label>월</label><input id="mo" type="number" value="2"></div>
    <div class="fld"><label>일</label><input id="d" type="number" value="22"></div>
    <div class="fld"><label>시 (비우면 미상)</label><input id="h" type="number" value="13"></div>
    <div class="fld"><label>분</label><input id="mi" type="number" value="13"></div>
    <div class="fld"><label>성별</label><select id="g"><option>남</option><option>여</option></select></div>
    <div class="fld"><label>달력</label><select id="cal"><option>양력</option><option>음력</option></select></div>
    <button id="go">계산</button>
  </div>

  <div id="status"></div>
  <div id="error" hidden></div>
  <div id="result" hidden></div>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
